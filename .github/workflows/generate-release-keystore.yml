name: Generate Android Release Keystore (ONE-TIME)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "GENERATE" to confirm keystore generation'
        required: true
        default: ''

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "GENERATE" ]; then
            echo "❌ Confirmation not provided. Please type 'GENERATE' to proceed."
            exit 1
          fi
          echo "✅ Confirmed. Proceeding with keystore generation..."

      - name: Generate random passwords
        id: passwords
        run: |
          STORE_PASS=$(openssl rand -base64 16)
          KEY_PASS=$(openssl rand -base64 16)
          echo "store_pass=${STORE_PASS}" >> $GITHUB_OUTPUT
          echo "key_pass=${KEY_PASS}" >> $GITHUB_OUTPUT
          echo "✅ Generated random passwords (not shown for security)"

      - name: Create artifact directory
        run: |
          mkdir -p keystore-artifact

      - name: Generate release keystore
        run: |
          keytool -genkey -v \
            -keystore keystore-artifact/release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias gemstone-release-key \
            -storepass "${{ steps.passwords.outputs.store_pass }}" \
            -keypass "${{ steps.passwords.outputs.key_pass }}" \
            -dname "CN=Gemstone,O=Gemstone,C=MM"
          echo "✅ Keystore generated successfully"

      - name: Extract certificate fingerprint
        id: fingerprint
        run: |
          SHA256=$(keytool -list -v -keystore keystore-artifact/release.keystore \
            -storepass "${{ steps.passwords.outputs.store_pass }}" \
            -alias gemstone-release-key | grep "SHA256:" | awk '{print $2}')
          SHA256_NO_COLONS=$(echo "${SHA256}" | tr -d ':')
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "sha256_no_colons=${SHA256_NO_COLONS}" >> $GITHUB_OUTPUT
          echo "✅ Certificate fingerprint extracted"
          echo "SHA-256: ${SHA256}"

      - name: Convert keystore to base64
        run: |
          base64 -w 0 keystore-artifact/release.keystore > keystore-artifact/release.keystore.base64
          echo "" >> keystore-artifact/release.keystore.base64
          echo "✅ Keystore converted to base64"

      - name: Create keystore credentials file
        env:
          STORE_PASS: ${{ steps.passwords.outputs.store_pass }}
          KEY_PASS: ${{ steps.passwords.outputs.key_pass }}
        run: |
          {
            echo "=== ANDROID RELEASE KEYSTORE CREDENTIALS ==="
            echo "KEEP THIS FILE SAFE - You will need these values for GitHub secrets."
            echo ""
            echo "ANDROID_KEYSTORE_PASSWORD (store password):"
            echo "${STORE_PASS}"
            echo ""
            echo "ANDROID_KEY_ALIAS:"
            echo "gemstone-release-key"
            echo ""
            echo "ANDROID_KEY_PASSWORD (key password):"
            echo "${KEY_PASS}"
            echo ""
            echo "Certificate Validity: 10,000 days (27+ years)"
            echo "Generated: $(date -u)"
          } > keystore-artifact/keystore-credentials.txt
          echo "✅ Credentials file created"

      - name: Create certificate fingerprint file
        run: |
          {
            echo "=== ANDROID RELEASE CERTIFICATE FINGERPRINT ==="
            echo ""
            echo "SHA-256 (with colons):"
            echo "${{ steps.fingerprint.outputs.sha256 }}"
            echo ""
            echo "SHA-256 (without colons - for comparison):"
            echo "${{ steps.fingerprint.outputs.sha256_no_colons }}"
            echo ""
            echo "Use this fingerprint to verify all future APKs are signed with the same certificate."
          } > keystore-artifact/certificate-fingerprint.txt
          echo "✅ Fingerprint file created"

      - name: Create phone setup instructions
        run: |
          echo '' | base64 -d > keystore-artifact/PHONE_SETUP_INSTRUCTIONS.txt
          echo "✅ Phone setup instructions created"

      - name: Verify artifact contents
        run: |
          echo "=== Artifact Contents ==="
          ls -lh keystore-artifact/
          echo ""
          echo "Files created:"
          echo "  ✅ release.keystore (binary keystore file)"
          echo "  ✅ release.keystore.base64 (base64-encoded keystore)"
          echo "  ✅ keystore-credentials.txt (passwords and alias)"
          echo "  ✅ certificate-fingerprint.txt (SHA-256 fingerprint)"
          echo "  ✅ PHONE_SETUP_INSTRUCTIONS.txt (setup guide)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-permanent-release-keystore
          path: keystore-artifact/
          retention-days: 7
          if-no-files-found: error

      - name: Print completion summary
        run: |
          echo "=========================================="
          echo "✅ KEYSTORE GENERATION COMPLETE"
          echo "=========================================="
          echo ""
          echo "NEXT STEPS:"
          echo "1. Download artifact from Actions"
          echo "2. Extract the ZIP file"
          echo "3. Follow PHONE_SETUP_INSTRUCTIONS.txt"
          echo "4. Create 4 GitHub secrets"
          echo "5. Confirm when all secrets are created"
          echo ""
          echo "Artifact will be available for 7 days."
          echo "=========================================="
