name: Flutter Build & Analyze

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get Flutter version
        run: flutter --version

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Validate release signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::ANDROID_KEY_PASSWORD secret is not set"
            exit 1
          fi
          echo "✅ All release signing secrets are present"

      - name: Reconstruct Android release keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Failed to decode keystore - file is empty"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s android/app/release.keystore 2>/dev/null || stat -f%z android/app/release.keystore)
          echo "✅ Keystore reconstructed (size: $FILE_SIZE bytes)"

      - name: Generate key.properties
        run: |
          cat > android/key.properties << 'KEYEOF'
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYEOF
          echo "✅ key.properties generated"

      - name: Run dart analyze
        run: |
          dart analyze > dart_analyze.txt 2>&1 || true
          cat dart_analyze.txt

      - name: Build APK (Release)
        run: |
          set +e
          flutter build apk --release --no-shrink
          BUILD_EXIT_CODE=$?
          set -e
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== BUILD EXIT CODE: $BUILD_EXIT_CODE ==="
            echo "=== BUILD END $(date) ==="
            exit $BUILD_EXIT_CODE
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/app/outputs/logs/
          retention-days: 7

      - name: Upload dart analyze output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-analyze-output
          path: dart_analyze.txt
          retention-days: 7
