name: Flutter Build & Analyze

on:
  push:
    branches:
      - main
      - refactor/**
      - release-signing-fix
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get Flutter version
        run: flutter --version

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Run dart analyze
        run: |
          dart analyze > dart_analyze.txt 2>&1 || true
          cat dart_analyze.txt

      - name: Verify Release Keystore
        run: |
          echo "=== VERIFYING RELEASE KEYSTORE ==="
          
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          
          if [ ! -f android/app/release.keystore ]; then
            echo "::error::Failed to reconstruct keystore file"
            exit 1
          fi
          
          KEYSTORE_SIZE=$(stat -c%s android/app/release.keystore)
          echo "Keystore file size: $KEYSTORE_SIZE bytes"
          
          KEYSTORE_SHA256=$(sha256sum android/app/release.keystore | cut -d' ' -f1)
          echo "Keystore SHA-256: $KEYSTORE_SHA256"
          
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret is not set"
            exit 1
          fi
          
          if keytool -list -v -keystore android/app/release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" > /tmp/keystore_info.txt 2>&1; then
            echo "Keystore verification successful"
            grep -E "Owner:|Issuer:|Serial|Valid from:|Certificate fingerprints:|SHA256:" /tmp/keystore_info.txt || true
          else
            echo "::error::Keystore verification failed"
            cat /tmp/keystore_info.txt
            exit 1
          fi
          
          echo "=== END KEYSTORE VERIFICATION ==="

      - name: Generate key.properties
        run: |
          echo "=== GENERATING key.properties ==="
          {
            printf '%s\n' "storeFile=release.keystore"
            printf '%s\n' "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            printf '%s\n' "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            printf '%s\n' "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
          echo "key.properties generated"

      - name: Build APK (Release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          echo "=== BUILD START $(date -u) ===" | tee build_log.txt
          echo "=== pwd ===" | tee -a build_log.txt
          pwd | tee -a build_log.txt
          echo "" | tee -a build_log.txt
          echo "=== flutter build apk --release --no-shrink ===" | tee -a build_log.txt
          flutter build apk --release --no-shrink 2>&1 | tee -a build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "" | tee -a build_log.txt
          echo "=== BUILD EXIT CODE: $BUILD_EXIT ===" | tee -a build_log.txt
          echo "=== BUILD END $(date -u) ===" | tee -a build_log.txt
          echo "" | tee -a build_log.txt
          echo "=== build_log.txt size: $(wc -c < build_log.txt) bytes ===" | tee -a build_log.txt
          echo "=== build_log.txt lines: $(wc -l < build_log.txt) ===" | tee -a build_log.txt
          echo "" | tee -a build_log.txt
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== FAILURE DETECTED - Capturing additional diagnostics ===" | tee -a build_log.txt
            echo "" | tee -a build_log.txt
            echo "=== find . -name '*.apk' ===" | tee -a build_log.txt
            find . -name "*.apk" 2>&1 | tee -a build_log.txt
            echo "" | tee -a build_log.txt
            echo "=== ls -R build/app 2>&1 || true ===" | tee -a build_log.txt
            ls -R build/app 2>&1 | tee -a build_log.txt || true
            echo "" | tee -a build_log.txt
            echo "::error::Flutter build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

      - name: Upload dart analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-analyze-output
          path: dart_analyze.txt
          retention-days: 7

      - name: Verify build log is not empty
        if: always()
        run: |
          echo "=== build_log.txt verification ==="
          if [ ! -f build_log.txt ]; then
            echo "ERROR: build_log.txt does not exist"
            echo "build_log.txt was not created" > build_log.txt
          fi
          FILE_SIZE=$(wc -c < build_log.txt)
          FILE_LINES=$(wc -l < build_log.txt)
          echo "File size: $FILE_SIZE bytes"
          echo "File lines: $FILE_LINES"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "WARNING: build_log.txt is suspiciously small ($FILE_SIZE bytes)"
            echo "--- Contents ---"
            cat build_log.txt
            echo "--- End ---"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7

      - name: Verify APK was built
        run: |
          echo "=== pwd before APK verification ==="
          pwd
          echo "=== ls -R build/app/outputs || true ==="
          ls -R build/app/outputs || true
          echo "=== find . -name '*.apk' ==="
          find . -name "*.apk"
          APK=$(find build/app/outputs -type f -name "*.apk" | tail -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK not found in build/app/outputs"
            echo "Complete build directory tree:"
            find build -type f 2>/dev/null || echo "No build directory"
            exit 1
          fi
          echo "APK found: $APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error
